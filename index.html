<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para mi Esposita ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .contenedor {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* =========================
           SOBRE
        ========================= */

        .sobre {
            position: relative;
            width: 300px;
            height: 200px;
            background: #f4b6c2;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            z-index: 2;
        }

        .sobre::before {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;

            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            border-bottom: 100px solid #e89aaa;
        }

        /* TAPA DEL SOBRE */

        .tapa {
            position: absolute;
            top: 0;
            left: 0;

            width: 0;
            height: 0;

            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            border-top: 110px solid #d98798;

            transform-origin: top;
            transition: transform 0.8s ease;

            z-index: 3;
        }

        /* TEXTO DEL SOBRE */

        .texto-sobre {
            position: absolute;

            width: 100%;
            text-align: center;

            top: 85px;

            font-size: 22px;
            font-weight: bold;

            color: white;

            z-index: 4;
        }

        /* =========================
           CARTA
        ========================= */

        .carta {
            position: fixed;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%)
                scale(0);

            width: 350px;
            min-height: 400px;

            padding: 35px;

            background: white;

            border-radius: 18px;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.3);

            text-align: center;

            opacity: 0;

            transition:
                all 1s ease;

            z-index: 10;
        }

        .carta h1 {
            color: #e75480;

            margin-bottom: 30px;
        }

        .carta p {
            font-size: 20px;

            line-height: 1.6;

            color: #444;
        }

        /* CORAZÓN GRANDE */

        .corazon {
            font-size: 60px;

            margin: 20px 0;

            animation:
                latido 1s infinite;
        }

        /* DESPEDIDA */

        .despedida {
            font-size: 22px;

            font-weight: bold;

            color: #e75480;
        }

        /* =========================
           SOBRE ABIERTO
        ========================= */

        .sobre.abierto .tapa {
            transform: rotateX(180deg);
        }

        .sobre.abierto + .carta {
            transform:
                translate(-50%, -50%)
                scale(1);

            opacity: 1;
        }

        /* =========================
           CORAZONES FLOTANDO
        ========================= */

        .corazon-flotante {
            position: fixed;

            bottom: -30px;

            font-size: 25px;

            animation:
                subir 4s linear forwards;

            pointer-events: none;

            z-index: 20;
        }

        /* =========================
           ANIMACIÓN DEL CORAZÓN
        ========================= */

        @keyframes latido {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
            }

        }

        /* =========================
           ANIMACIÓN DE LOS CORAZONES
        ========================= */

        @keyframes subir {

            0% {
                transform:
                    translateY(0);

                opacity: 1;
            }

            100% {
                transform:
                    translateY(-100vh);

                opacity: 0;
            }

        }

    </style>
</head>


<body>

    <div class="contenedor">

        <!-- =====================
             SOBRE
        ====================== -->

        <div
            class="sobre"
            onclick="abrirSobre()"
        >

            <div class="tapa"></div>

            <div class="texto-sobre">
                💌 Haz clic para abrir
            </div>

        </div>


        <!-- =====================
             CARTA
        ====================== -->

        <div class="carta">

            <h1>
                Esposita mia ❤️
            </h1>

            <p>
                Quería recordarte que eres
                lo más lindo.
            </p>

            <p>
                me haces feliz,
                te admiro muchísimo
                y te amo demasiado.
            </p>

            <div class="corazon">
                ❤️
            </div>

            <div class="despedida">
                Qué fastidio 😘
            </div>

        </div>

    </div>


    <!-- =====================
         JAVASCRIPT
    ====================== -->

    <script>

        function abrirSobre() {

            const sobre =
                document.querySelector(".sobre");

            sobre.classList.toggle("abierto");

            if (
                sobre.classList.contains("abierto")
            ) {

                crearCorazones();

            }

        }


        function crearCorazones() {

            for (
                let i = 0;
                i < 25;
                i++
            ) {

                const corazon =
                    document.createElement("div");

                corazon.classList.add(
                    "corazon-flotante"
                );

                corazon.innerHTML = "❤️";

                corazon.style.left =
                    Math.random() * 100 + "vw";

                corazon.style.animationDuration =
                    (3 + Math.random() * 3) + "s";

                corazon.style.fontSize =
                    (15 + Math.random() * 25) + "px";

                document.body.appendChild(
                    corazon
                );

                setTimeout(
                    function() {

                        corazon.remove();

                    },
                    6000
                );

            }

        }

    </script>

</body>

</html>
